name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Using latest for 2026 stability
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # This action automatically finds your gradlew file and sets permissions
          # If your android code is in a subfolder, add: build-root-directory: YOUR_FOLDER_NAME
          gradle-version: wrapper

      - name: Build Debug APK
        run: ./whatnot-android/gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # This search pattern finds the APK even if it's in a subfolder
          path: "**/build/outputs/apk/debug/*.apk"
